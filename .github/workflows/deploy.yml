name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1つに絞り、進行中のデプロイはキャンセルしない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test (ゲームロジックの検証)
        run: npm test
      - name: Build (型チェック + vite build)
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # Pages 側の一時エラー（"Deployment failed, try again later."）で、ビルド成功後の
      # デプロイだけが落ちることがある（2026-07-04 Run #32 で発生）。1回だけ自動で再試行する。
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry（一時エラー対策）
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        name: Deploy (retry)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
